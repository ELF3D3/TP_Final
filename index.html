<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strongify (Preliminar 2)</title>
  <meta name="description" content="Strongify: rutina dinámica y control con LocalStorage.">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand" role="button" tabindex="0" aria-label="Ir a inicio">
        <div class="logo" aria-hidden="true"></div>
        <h1>Strongify</h1>
      </div>
      <nav aria-label="Principal">
        <ul class="nav nav-pc">
          <li><button class="nav-link active" data-section="inicio">Inicio</button></li>
          <li><button class="nav-link" data-section="rutina">Rutina</button></li>
          <li><button class="nav-link" data-section="control">Control</button></li>
          <li><button class="nav-link" data-section="tienda">Tienda</button></li>
        </ul>
        <div class="nav-mobile">
          <button id="hamburger" aria-expanded="false" aria-controls="mobile-menu" class="btn small ghost">☰</button>
          <ul id="mobile-menu" class="mobile-menu hidden" role="menu">
            <li><button role="menuitem" class="nav-link" data-section="inicio">Inicio</button></li>
            <li><button role="menuitem" class="nav-link" data-section="rutina">Rutina</button></li>
            <li><button role="menuitem" class="nav-link" data-section="control">Control</button></li>
            <li><button role="menuitem" class="nav-link" data-section="tienda">Tienda</button></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- INICIO -->
    <section id="inicio" class="section active">
      <div class="hero">
        <div>
          <span class="hero-badge">🟩 Plan en marcha</span>
          <h2>Tu día, tu progreso</h2>
          <p>Hoy es <strong id="dia-actual">—</strong>. Te toca: <strong id="rutina-dia">—</strong>.</p>
          <div class="kpi">
            <div class="kpi-item card">
              <span class="badge">Peso</span>
              <strong><span id="peso-actual">—</span> kg</strong>
              <small class="muted">último guardado</small>
            </div>
            <div class="kpi-item card">
              <span class="badge">Racha</span>
              <strong><span id="racha">0</span> días</strong>
              <small class="muted">objetivo cumplido</small>
            </div>
            <div class="kpi-item card">
              <span class="badge">Semana</span>
              <strong id="semana-resumen">—</strong>
              <small class="muted">resumen rápido</small>
            </div>
          </div>
          <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn shimmer" data-section="control">Actualizar peso</button>
            <button class="btn ghost" data-section="rutina">Ver rutina</button>
          </div>
        </div>
      </div>
    </section>

    <!-- RUTINA -->
    <section id="rutina" class="section hidden">
      <h2>Rutina semanal</h2>
      <ul id="rutina-semanal" class="list"></ul>
    </section>
